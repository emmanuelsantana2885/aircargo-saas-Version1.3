apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: aircargo-services
  namespace: aircargo
  labels:
    release: prometheus
    app: aircargo
spec:
  selector:
    matchLabels:
      app: aircargo-gateway
  namespaceSelector:
    matchNames:
      - aircargo
  endpoints:
  - port: http
    path: /actuator/prometheus
    interval: 30s
    honorLabels: true
---
