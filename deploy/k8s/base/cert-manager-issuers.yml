apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app: aircargo
    component: tls
spec:
  acme:
    # ACME server URL (Let's Encrypt production)
    server: https://acme-v02.api.letsencrypt.org/directory
    # Email for expiry notifications and registration
    email: admin@yourdomain.com
    # Private key for ACME account
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    # HTTP-01 challenge solver (uses nginx ingress)
    solvers:
    - http01:
        ingress:
          class: nginx
          # Optional: specify ingress selector for dedicated solver ingress
          # selector:
          #   matchLabels:
          #     cert-manager.io/solver: "true"
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  labels:
    app: aircargo
    component: tls
spec:
  acme:
    # Staging endpoint (higher rate limits, not trusted by browsers)
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: admin@yourdomain.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
    - http01:
        ingress:
          class: nginx