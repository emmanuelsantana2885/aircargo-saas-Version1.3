# Base deployment template for all aircargo backend services
# This is a template - create individual files for each service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aircargo-export-service
  namespace: aircargo
  labels:
    app: aircargo-export-service
    version: "latest"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aircargo-export-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: aircargo-export-service
        version: "latest"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9099"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      serviceAccountName: aircargo-sa
      containers:
        - name: aircargo-export-service
          image: "ghcr.io/your-org/aircargo-export-service:latest"
          imagePullPolicy: Always
          ports:
            - containerPort: 9099
              name: http
          envFrom:
            - configMapRef:
                name: aircargo-config
            - secretRef:
                name: aircargo-secrets
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "production"
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75"
          resources:
            requests:
              memory: "384Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 9099
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9099
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 9099
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
---
apiVersion: v1
kind: Service
metadata:
  name: aircargo-export-service
  namespace: aircargo
  labels:
    app: aircargo-export-service
spec:
  selector:
    app: aircargo-export-service
  ports:
    - port: 9099
      targetPort: 9099
      name: http
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aircargo-export-service-hpa
  namespace: aircargo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aircargo-export-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 15
      selectPolicy: Max
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aircargo-export-service-pdb
  namespace: aircargo
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: aircargo-export-service