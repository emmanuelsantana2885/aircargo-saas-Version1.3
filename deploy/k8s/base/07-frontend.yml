apiVersion: apps/v1
kind: Deployment
metadata:
  name: aircargo-frontend
  namespace: aircargo
  labels:
    app: aircargo-frontend
    version: "latest"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aircargo-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: aircargo-frontend
        version: "latest"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      serviceAccountName: aircargo-sa
      containers:
        - name: aircargo-frontend
          image: "ghcr.io/your-org/aircargo-frontend:latest"
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: aircargo-config
                  key: FRONTEND_URL
                  optional: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: aircargo-frontend
  namespace: aircargo
  labels:
    app: aircargo-frontend
spec:
  selector:
    app: aircargo-frontend
  ports:
    - port: 80
      targetPort: 8080
      name: http
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aircargo-frontend-hpa
  namespace: aircargo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aircargo-frontend
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aircargo-frontend-pdb
  namespace: aircargo
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: aircargo-frontend