# External Secrets Operator for Aircargo
# Deploy: kubectl apply -k deploy/observability/external-secrets/
# Prerequisites: helm install external-secrets external-secrets/external-secrets -n external-secrets

---
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  labels:
    name: external-secrets
    app: external-secrets
---
# ─── ClusterSecretStore: AWS Secrets Manager ──────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  labels:
    app: external-secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        # Use IRSA (IAM Role for Service Account) - recommended
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
      # Fallback: static credentials (NOT recommended for production)
      # credentials:
      #   accessKeyID:
      #     secretRef:
      #       name: aws-credentials
      #       key: access-key-id
      #   secretAccessKey:
      #     secretRef:
      #       name: aws-credentials
      #       key: secret-access-key
---
# ─── ClusterSecretStore: HashiCorp Vault ──────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: hashicorp-vault
  labels:
    app: external-secrets
spec:
  provider:
    vault:
      server: "https://vault.yourcompany.com"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
---
# ─── ClusterSecretStore: GCP Secret Manager ───────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
  labels:
    app: external-secrets
spec:
  provider:
    gcpsm:
      projectID: "your-gcp-project"
      auth:
        workloadIdentity:
          clusterLocation: "us-central1"
          clusterName: "aircargo-prod"
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
---
# ─── ServiceAccount for IRSA ──────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: external-secrets
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/ExternalSecretsRole"
    # For GCP Workload Identity:
    # iam.gke.io/gcp-service-account: "external-secrets@your-project.iam.gserviceaccount.com"
---
# ─── ExternalSecret: Aircargo Production Secrets ──────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aircargo-secrets
  namespace: aircargo
  labels:
    app: aircargo
    component: secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: aircargo-secrets
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app: aircargo
          component: secrets
        annotations:
          external-secrets.io/managed: "true"
      data:
        # Map from secret manager keys to Kubernetes secret keys
        JWT_SECRET: "{{ .aircargo_jwt_secret }}"
        POSTGRES_PASSWORD: "{{ .aircargo_postgres_password }}"
        RABBITMQ_PASSWORD: "{{ .aircargo_rabbitmq_password }}"
        APP_ENCRYPTION_KEY: "{{ .aircargo_encryption_key }}"
        SMTP_HOST: "{{ .aircargo_smtp_host }}"
        SMTP_PORT: "{{ .aircargo_smtp_port }}"
        SMTP_USERNAME: "{{ .aircargo_smtp_username }}"
        SMTP_PASSWORD: "{{ .aircargo_smtp_password }}"
        SMTP_FROM: "{{ .aircargo_smtp_from }}"
        MFA_RESET_ON_STARTUP: "{{ .aircargo_mfa_reset_on_startup | default \"false\" }}"
        MFA_MAX_AGE_DAYS: "{{ .aircargo_mfa_max_age_days | default \"7\" }}"
        AWS_ACCESS_KEY_ID: "{{ .aircargo_aws_access_key_id | default \"\" }}"
        AWS_SECRET_ACCESS_KEY: "{{ .aircargo_aws_secret_access_key | default \"\" }}"
        AWS_S3_BUCKET: "{{ .aircargo_aws_s3_bucket | default \"\" }}"
        AWS_REGION: "{{ .aircargo_aws_region | default \"us-east-1\" }}"
  dataFrom:
  - extract:
      key: aircargo/production/secrets
    rewrite:
    - regexp:
        source: "(.*)"
        target: "aircargo_{{ . | lower }}"
---
# ─── ExternalSecret: TLS Certificates (if not using cert-manager) ─
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aircargo-tls
  namespace: aircargo
  labels:
    app: aircargo
    component: tls
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: aircargo-tls-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
      metadata:
        labels:
          app: aircargo
          component: tls
      data:
        tls.crt: "{{ .aircargo_tls_crt }}"
        tls.key: "{{ .aircargo_tls_key }}"
  data:
  - secretKey: aircargo_tls_crt
    remoteRef:
      key: aircargo/production/tls
      property: certificate
  - secretKey: aircargo_tls_key
    remoteRef:
      key: aircargo/production/tls
      property: private_key
---
# ─── SecretStore (Namespace-scoped alternative) ───────────────────
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aircargo-secret-store
  namespace: aircargo
  labels:
    app: aircargo
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
---
# ─── ExternalSecret: Staging ──────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aircargo-secrets-staging
  namespace: aircargo-staging
  labels:
    app: aircargo
    component: secrets
    environment: staging
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aircargo-secret-store
    kind: SecretStore
  target:
    name: aircargo-secrets
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app: aircargo
          component: secrets
          environment: staging
        annotations:
          external-secrets.io/managed: "true"
      data:
        JWT_SECRET: "{{ .aircargo_jwt_secret }}"
        POSTGRES_PASSWORD: "{{ .aircargo_postgres_password }}"
        RABBITMQ_PASSWORD: "{{ .aircargo_rabbitmq_password }}"
        APP_ENCRYPTION_KEY: "{{ .aircargo_encryption_key }}"
        SMTP_HOST: "{{ .aircargo_smtp_host }}"
        SMTP_PORT: "{{ .aircargo_smtp_port }}"
        SMTP_USERNAME: "{{ .aircargo_smtp_username }}"
        SMTP_PASSWORD: "{{ .aircargo_smtp_password }}"
        SMTP_FROM: "{{ .aircargo_smtp_from }}"
        MFA_RESET_ON_STARTUP: "{{ .aircargo_mfa_reset_on_startup | default \"true\" }}"
        MFA_MAX_AGE_DAYS: "{{ .aircargo_mfa_max_age_days | default \"1\" }}"
  dataFrom:
  - extract:
      key: aircargo/staging/secrets
---
# ─── PrometheusRule for External Secrets monitoring ───────────────
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: external-secrets-alerts
  namespace: external-secrets
  labels:
    release: prometheus
    app: external-secrets
spec:
  groups:
  - name: external-secrets
    rules:
    - alert: ExternalSecretSyncFailed
      expr: external_secrets_sync_failed == 1
      for: 5m
      labels:
        severity: critical
        team: platform
      annotations:
        summary: "ExternalSecret {{ $labels.name }} sync failed"
        description: "ExternalSecret {{ $labels.name }} in namespace {{ $labels.namespace }} has failed to sync: {{ $value }}"
    - alert: ExternalSecretNotSynced
      expr: time() - external_secrets_last_synced_timestamp_seconds > 3600
      for: 10m
      labels:
        severity: warning
        team: platform
      annotations:
        summary: "ExternalSecret {{ $labels.name }} not synced for > 1h"
        description: "Last successful sync was {{ $value | humanizeTimestamp }}"
    - alert: ClusterSecretStoreUnhealthy
      expr: cluster_secret_store_condition_ready == 0
      for: 5m
      labels:
        severity: critical
        team: platform
      annotations:
        summary: "ClusterSecretStore {{ $labels.name }} not ready"
        description: "ClusterSecretStore {{ $labels.name }} is not ready - check provider connectivity"