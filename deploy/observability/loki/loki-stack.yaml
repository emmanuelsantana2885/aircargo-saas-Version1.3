# Loki Stack for Aircargo - Centralized Logging
# Deploy: kubectl apply -k deploy/observability/loki/

---
apiVersion: v1
kind: Namespace
metadata:
  name: logging
  labels:
    name: logging
    app: loki-stack
---
# ─── Loki (Log Storage) ────────────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  namespace: logging
  labels:
    app: loki
spec:
  serviceName: loki
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
      - name: loki
        image: grafana/loki:2.9.0
        args:
        - -config.file=/etc/loki/local-config.yaml
        ports:
        - containerPort: 3100
          name: http
        volumeMounts:
        - name: config
          mountPath: /etc/loki
        - name: data
          mountPath: /loki
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      volumes:
      - name: config
        configMap:
          name: loki-config
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: standard
      resources:
        requests:
          storage: 50Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: logging
data:
  local-config.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory
    schema_config:
      configs:
      - from: 2024-01-01
        store: boltdb-shipper
        object_store: filesystem
        schema: v11
        index:
          prefix: index_
          period: 24h
    limits_config:
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      retention_period: 168h
      max_entries_limit_per_query: 5000
      max_query_parallelism: 32
    chunk_store_config:
      max_look_back_period: 168h
    table_manager:
      retention_deletes_enabled: true
      retention_period: 168h
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: logging
  labels:
    app: loki
spec:
  selector:
    app: loki
  ports:
  - name: http
    port: 3100
    targetPort: 3100
  - name: grpc
    port: 9096
    targetPort: 9096
  clusterIP: None
---
# ─── Vector (Log Agent) ────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-config
  namespace: logging
data:
  vector.yaml: |
    data_dir: /var/lib/vector
    
    sources:
      kubernetes_logs:
        type: kubernetes_logs
        include_annotations: ["prometheus.io/scrape", "prometheus.io/port", "prometheus.io/path"]
        include_labels: ["app", "version", "component"]
        namespace: "aircargo"
        
    transforms:
      add_k8s_metadata:
        type: remap
        inputs: ["kubernetes_logs"]
        source: |
          .namespace = .kubernetes.namespace_name
          .pod = .kubernetes.pod_name
          .container = .kubernetes.container_name
          .labels = .kubernetes.labels
          .annotations = .kubernetes.annotations
          .host = .kubernetes.host
          del(.kubernetes)
          
      parse_json:
        type: remap
        inputs: ["add_k8s_metadata"]
        source: |
          # Try to parse JSON log lines (Spring Boot JSON logs)
          if .message is string {
            parsed, err = parse_json(.message)
            if err == null {
              . = merge(., parsed)
            }
          }
          # Extract level from various formats
          if .level is string {
            .log_level = .level
          } else if .severity is string {
            .log_level = .severity
          } else if .level is int {
            .log_level = to_string(.level)
          }
          
      enrich_aircargo:
        type: remap
        inputs: ["parse_json"]
        source: |
          # Add service name from labels
          .service = .labels.app ?? "unknown"
          .version = .labels.version ?? "unknown"
          .environment = "production"
          
          # Normalize timestamp
          if .timestamp is string {
            .event_time = .timestamp
          } else if .["@timestamp"] is string {
            .event_time = .["@timestamp"]
          }
          
    sinks:
      loki:
        type: loki
        inputs: ["enrich_aircargo"]
        endpoint: "http://loki.logging.svc.cluster.local:3100/loki/api/v1/push"
        labels:
          namespace: "{{ namespace }}"
          pod: "{{ pod }}"
          container: "{{ container }}"
          service: "{{ service }}"
          environment: "{{ environment }}"
        batch:
          max_size: 102400
          timeout: 5
        healthcheck:
          enabled: true
          interval: 30
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector
  namespace: logging
  labels:
    app: vector
spec:
  selector:
    matchLabels:
      app: vector
  template:
    metadata:
      labels:
        app: vector
    spec:
      serviceAccountName: vector
      containers:
      - name: vector
        image: timberio/vector:0.38.0-alpine
        args: ["--config", "/etc/vector/vector.yaml"]
        volumeMounts:
        - name: config
          mountPath: /etc/vector
        - name: varlog
          mountPath: /var/log
          readOnly: true
        - name: varlibdocker
          mountPath: /var/lib/docker/containers
          readOnly: true
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: config
        configMap:
          name: vector-config
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlibdocker
        hostPath:
          path: /var/lib/docker/containers
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector
  namespace: logging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vector
rules:
- apiGroups: [""]
  resources: ["nodes", "namespaces", "pods", "pods/log"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vector
subjects:
- kind: ServiceAccount
  name: vector
  namespace: logging
---
# ─── Grafana Datasource for Loki ──────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-loki-datasource
  namespace: logging
  labels:
    grafana_datasource: "1"
data:
  loki.yaml: |
    apiVersion: 1
    datasources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.logging.svc.cluster.local:3100
      jsonData:
        maxLines: 1000
        derivedFields:
        - name: traceID
          matcherRegex: "trace[=:][\"']?([a-f0-9]{32})[\"']?"
          url: "http://tempo.tracing.svc.cluster.local:3200/tempo/traces/${__value.raw}"
          datasourceUid: tempo