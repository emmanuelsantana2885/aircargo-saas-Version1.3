# CI/CD Security Pipeline with Trivy, Dependency Check, and SBOM
# File: .github/workflows/ci-cd.yml

---
name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  MAVEN_OPTS: "-Dmaven.test.failure.ignore=false"

jobs:
  # ─── Build & Test ─────────────────────────────────────────────────
  build-and-test:
    name: Build & Test (Backend)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      
      - name: Build Backend (offline)
        run: |
          cd backend
          mvn -o clean install -DskipTests -Dspotless.check.skip=true
      
      - name: Run Tests
        run: |
          cd backend
          mvn test -DskipITs=false
      
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: backend/**/target/surefire-reports/
          retention-days: 7
      
      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run lint
          npm run build
      
      - name: Upload Frontend Build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ─── Security Scans ───────────────────────────────────────────────
  security-scan:
    name: Security Scans
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run Trivy FS Scanner (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './backend'
          format: 'sarif'
          output: 'trivy-backend.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
      
      - name: Run Trivy FS Scanner (Frontend)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './frontend'
          format: 'sarif'
          output: 'trivy-frontend.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
      
      - name: Upload Trivy Results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-backend.sarif'
          category: 'trivy-backend'
      
      - name: Upload Trivy Results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-frontend.sarif'
          category: 'trivy-frontend'
      
      - name: Run OWASP Dependency Check (Maven)
        run: |
          cd backend
          mvn org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 \
            -DsuppressionFiles=dependency-check-suppression.xml \
            -Dformat=HTML,JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload Dependency Check Reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: backend/**/target/dependency-check-report.*
          retention-days: 30
      
      - name: Generate SBOM (Backend)
        run: |
          cd backend
          mvn org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom \
            -Dcyclonedx.schemaVersion=1.5 \
            -Dcyclonedx.outputFormat=JSON
      
      - name: Generate SBOM (Frontend)
        run: |
          cd frontend
          npx @cyclonedx/bom@latest -o sbom.json
      
      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            backend/target/bom.json
            frontend/sbom.json
          retention-days: 90

  # ─── Container Image Build & Scan ─────────────────────────────────
  container-build:
    name: Build & Scan Container Images
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 30
    strategy:
      matrix:
        service:
          - aircargo-gateway
          - aircargo-auth-service
          - aircargo-flight-service
          - aircargo-booking-service
          - aircargo-mawb-service
          - aircargo-warehouse-service
          - aircargo-uld-service
          - aircargo-load-planning-service
          - aircargo-export-service
          - aircargo-notification-service
          - aircargo-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend/${{ matrix.service }}
          file: ./backend/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
        # For frontend, use different context
        env:
          DOCKERFILE: ${{ matrix.service == 'aircargo-frontend' && './frontend/Dockerfile' || '' }}
      
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:${{ steps.meta.outputs.tags }}
          format: 'sarif'
          output: 'trivy-image-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
      
      - name: Upload Image Scan Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-image-${{ matrix.service }}.sarif'
          category: 'trivy-image-${{ matrix.service }}'
      
      - name: Cosign Sign Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.0'
      
      - name: Sign with Cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          COSIGN_EXPERIMENTAL: 'true'
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}

  # ─── Deploy Staging ───────────────────────────────────────────────
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan, container-build]
    if: github.ref == 'refs/heads/develop'
    timeout-minutes: 15
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Deploy to Staging
        run: |
          kubectl config use-context staging
          ./deploy/deploy.sh staging
      
      - name: Verify Staging
        run: |
          ./deploy/verify-deployment.sh
      
      - name: Run Smoke Tests
        run: |
          ./scripts/load-test.sh --url https://staging-api.yourdomain.com --users 5 --duration 30

  # ─── Deploy Production ────────────────────────────────────────────
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan, container-build]
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Deploy to Production
        run: |
          kubectl config use-context production
          ./deploy/deploy.sh production
      
      - name: Verify Production
        run: |
          ./deploy/verify-deployment.sh
      
      - name: Run Production Smoke Tests
        run: |
          ./scripts/load-test.sh --url https://api.yourdomain.com --users 10 --duration 60
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false