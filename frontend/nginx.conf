# ─── Aircargo — frontend nginx config (container port 8080) ───
# HTTPS is enabled automatically by /entrypoint.sh when DOMAIN is set and a
# Let's Encrypt certificate exists in /etc/letsencrypt/live/$DOMAIN.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # API proxy → gateway (Spring Cloud Gateway)
    location /api/ {
        proxy_pass http://aircargo-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Static assets — cache forever (Vite hashes filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — every non-file route serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}