spring.application.name=aircargo-export-service
server.port=9099

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:aircargo}?currentSchema=export_bi,public&sslmode=disable
spring.datasource.username=${POSTGRES_USER:aircargo_user}
spring.datasource.password=${POSTGRES_PASSWORD:aircargo_pass_2024}
spring.datasource.hikari.read-only=false
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.pool-name=aircargo-export-pool
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=30000

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.schemas=export_bi
spring.flyway.create-schemas=true
spring.flyway.table=flyway_schema_history_export
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=60s

management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=aircargo-export

app.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-do-not-use-in-production-please-change-me}
app.jwt.expiration-ms=86400000

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Feign client URLs (for potential cross-service lookups)
flight-service.url=${FLIGHT_SERVICE_URL:http://localhost:9093}
uld-service.url=${ULD_SERVICE_URL:http://localhost:9097}
mawb-service.url=${MAWB_SERVICE_URL:http://localhost:9095}
booking-service.url=${BOOKING_SERVICE_URL:http://localhost:9094}
warehouse-service.url=${WAREHOUSE_SERVICE_URL:http://localhost:9096}

# ── Logging con rotación (Mayor D) ──────────────────────────────
logging.file.name=${LOG_DIR:${user.home}}/aircargo-logs/export-service.log
logging.logback.rollingpolicy.file-name-pattern=${LOG_DIR:${user.home}}/aircargo-logs/export-service.%d.yyyy-MM-dd.%i.gz
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=200MB

# Cliente Redis heredado de common — lazy: el servicio funciona sin Redis.
# No incluirlo en health para que /actuator/health no baje cuando no hay Redis (modo default).
management.health.redis.enabled=false
