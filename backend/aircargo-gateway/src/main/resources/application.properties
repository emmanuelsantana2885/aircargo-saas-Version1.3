spring.application.name=aircargo-gateway
server.port=8080
spring.main.web-application-type=reactive

# Gateway does not need a database — exclude JPA/DataSource auto-config
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# ─── CORS ────────────────────────────────────────
spring.cloud.gateway.httpclient.response-timeout=60s
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174}
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600

# ─── JWT ─────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-do-not-use-in-production-please-change-me}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ─── Rate Limiting ───────────────────────────────
# Per-user (X-User-Email) limiter, IN-PROCESS (per gateway instance).
# For 2+ gateway replicas this is NOT a global limit — use nginx limit_req
# or a shared store (Spring Cloud Gateway RequestRateLimiter + Redis) in HA.
app.gateway.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.gateway.rate-limit.limit-per-minute=${RATE_LIMIT_PER_MINUTE:100}
app.gateway.rate-limit.timeout-ms=${RATE_LIMIT_TIMEOUT_MS:50}
resilience4j.ratelimiter.configs.default.limit-for-period=100
resilience4j.ratelimiter.configs.default.limit-refresh-period=1m
resilience4j.ratelimiter.configs.default.timeout-duration=0

# ─── Circuit Breaker (relaxed for slow-booting constrained VMs) ───
# Default resilience4j time-limiter timeout is 1s — too aggressive for
# memory-constrained hosts where the first request after idle can be slow.
# NOTE: resilience4j 2.1.0 rejects `wait-duration-in-open-state` on
# configs.default ("waitIntervalFunction configured multiple times"),
# so rely on the default 60s open-state wait. Native resilience4j
# properties are the ones actually bound to the registry used by SCG.
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.slow-call-duration-threshold=30s
resilience4j.circuitbreaker.configs.default.slow-call-rate-threshold=80
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=80
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=5
resilience4j.timelimiter.configs.default.timeout-duration=60s
resilience4j.timelimiter.configs.default.cancel-running-future=true

# ─── Actuator ────────────────────────────────────
management.endpoints.web.exposure.include=health,info,gateway,circuitbreakers,circuitbreakerevents,ratelimiters
management.endpoint.health.show-details=when_authorized
management.health.circuitbreakers.enabled=true

# ─── Logging ─────────────────────────────────────
logging.level.com.aircargo.gateway=INFO
logging.level.org.springframework.cloud.gateway=INFO
logging.level.io.github.resilience4j=INFO

# ─── Swagger / Springdoc ──────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=auth
springdoc.swagger-ui.urls[0].url=/auth/api-docs
springdoc.swagger-ui.urls[1].name=flight
springdoc.swagger-ui.urls[1].url=/flight/api-docs
springdoc.swagger-ui.urls[2].name=booking
springdoc.swagger-ui.urls[2].url=/booking/api-docs
springdoc.swagger-ui.urls[3].name=mawb
springdoc.swagger-ui.urls[3].url=/mawb/api-docs
springdoc.swagger-ui.urls[4].name=warehouse
springdoc.swagger-ui.urls[4].url=/warehouse/api-docs
springdoc.swagger-ui.urls[5].name=uld
springdoc.swagger-ui.urls[5].url=/uld/api-docs
springdoc.swagger-ui.urls[6].name=load-planning
springdoc.swagger-ui.urls[6].url=/load-planning/api-docs
springdoc.swagger-ui.urls[7].name=export
springdoc.swagger-ui.urls[7].url=/export/api-docs
springdoc.swagger-ui.urls[8].name=notification
springdoc.swagger-ui.urls[8].url=/notification/api-docs

# ── Logging con rotación (Mayor D) ──────────────────────────────
logging.file.name=${LOG_DIR:${user.home}}/aircargo-logs/gateway.log
logging.logback.rollingpolicy.file-name-pattern=${LOG_DIR:${user.home}}/aircargo-logs/gateway.%d.yyyy-MM-dd.%i.gz
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=200MB
