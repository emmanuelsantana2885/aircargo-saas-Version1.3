spring.datasource.url=jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false
spring.cache.type=simple

app.jwt.secret=test-only-secret-abcdefghijklmnopqrstuvwxyz-0123456789-ABCDEFGHIJKLMNOPQRSTUVWXYZ-64chars
app.jwt.allow-dev-secret=true
app.jwt.expiration-ms=60000

# Tests existentes asumen login sin MFA → mantener desactivado salvo el test dedicado
app.mfa.mandatory=false
