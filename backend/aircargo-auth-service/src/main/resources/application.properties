spring.application.name=aircargo-auth-service
server.port=9092

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:aircargo}?sslmode=disable
spring.datasource.username=${POSTGRES_USER:aircargo_user}
spring.datasource.password=${POSTGRES_PASSWORD:?}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.pool-name=aircargo-auth-pool
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=30000

# Esquema gestionado por Flyway (migraciones explicitas). validate = falla el arranque si hay drift
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#spring.jpa.properties.hibernate.default_schema=auth

spring.flyway.enabled=true
spring.flyway.table=flyway_schema_history_auth
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Caching
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=600s

management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=aircargo-auth

app.jwt.secret=${JWT_SECRET:?}
app.jwt.expiration-ms=900000

# MFA obligatorio para TODOS los usuarios (forzado en login: sin MFA no hay sesión)
app.mfa.mandatory=true

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Cifrado en reposo de datos sensibles (mfaSecret, cedulas, firmas)
app.crypto.key=${APP_ENCRYPTION_KEY:}

app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Retencion de auditoria (Politica de Privacidad)
app.audit.retention-months=24

# ── Logging con rotación (Mayor D) ──────────────────────────────
logging.file.name=${LOG_DIR:${user.home}}/aircargo-logs/auth-service.log
logging.logback.rollingpolicy.file-name-pattern=${LOG_DIR:${user.home}}/aircargo-logs/auth-service.%d.yyyy-MM-dd.%i.gz
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=200MB

# Cliente Redis heredado de common — lazy: el servicio funciona sin Redis.
# No incluirlo en health para que /actuator/health no baje cuando no hay Redis (modo default).
management.health.redis.enabled=false
