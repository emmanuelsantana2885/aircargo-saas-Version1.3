spring.application.name=aircargo-load-planning-service
server.port=9098

spring.jpa.hibernate.ddl-auto=none

spring.flyway.enabled=false

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=120s

management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=aircargo-load-planning

app.jwt.secret=${JWT_SECRET:?}
app.jwt.expiration-ms=86400000

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Feign client URLs
flight-service.url=${FLIGHT_SERVICE_URL:http://localhost:9093}
uld-service.url=${ULD_SERVICE_URL:http://localhost:9097}
mawb-service.url=${MAWB_SERVICE_URL:http://localhost:9095}
booking-service.url=${BOOKING_SERVICE_URL:http://localhost:9094}

# ── Logging con rotación (Mayor D) ──────────────────────────────
logging.file.name=${LOG_DIR:${user.home}}/aircargo-logs/load-planning-service.log
logging.logback.rollingpolicy.file-name-pattern=${LOG_DIR:${user.home}}/aircargo-logs/load-planning-service.%d.yyyy-MM-dd.%i.gz
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=200MB

# Cliente Redis heredado de common — lazy: el servicio funciona sin Redis.
# No incluirlo en health para que /actuator/health no baje cuando no hay Redis (modo default).
management.health.redis.enabled=false
