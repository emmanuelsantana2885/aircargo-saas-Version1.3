spring.application.name=aircargo-flight-service
server.port=9093

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:aircargo}?sslmode=disable
spring.datasource.username=${POSTGRES_USER:aircargo_user}
spring.datasource.password=${POSTGRES_PASSWORD:aircargo_pass_2024}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.pool-name=aircargo-flight-pool
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=30000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history_flight
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:aircargo}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:aircargo_pass_2024}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
# mandatory=true: mensajes no enrutables se devuelven y quedan logueados (visibilidad)
spring.rabbitmq.template.mandatory=true
# reconexión automática del listener ante caídas del broker
spring.rabbitmq.listener.simple.retry.enabled=false

# Caching
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=300s

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=aircargo-flight
management.endpoint.health.show-details=always

app.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-do-not-use-in-production-please-change-me}
app.jwt.expiration-ms=86400000

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# ── Logging con rotación (Mayor D) ──────────────────────────────
logging.file.name=${LOG_DIR:${user.home}}/aircargo-logs/flight-service.log
logging.logback.rollingpolicy.file-name-pattern=${LOG_DIR:${user.home}}/aircargo-logs/flight-service.%d.yyyy-MM-dd.%i.gz
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=200MB
