# Trivy Secret Scanning Rules for Aircargo
# File: .trivy-secret.yaml

---
# Custom rules for secret detection
rules:
  # AWS credentials
  - id: aws-access-key
    name: AWS Access Key ID
    description: Detects AWS Access Key IDs
    severity: CRITICAL
    regex: '(?i)(aws_access_key_id|aws_access_key)\s*[:=]\s*[A-Z0-9]{20}'
    keywords:
      - aws_access_key_id
      - aws_access_key

  - id: aws-secret-key
    name: AWS Secret Access Key
    description: Detects AWS Secret Access Keys
    severity: CRITICAL
    regex: '(?i)(aws_secret_access_key|aws_secret_key)\s*[:=]\s*[A-Za-z0-9/+=]{40}'
    keywords:
      - aws_secret_access_key
      - aws_secret_key

  # GitHub tokens
  - id: github-token
    name: GitHub Personal Access Token
    description: Detects GitHub PATs
    severity: CRITICAL
    regex: 'gh[pousr]_[A-Za-z0-9]{36,255}'
    keywords:
      - ghp_
      - gho_
      - ghu_
      - ghs_
      - ghr_

  # Generic API keys
  - id: generic-api-key
    name: Generic API Key
    description: Detects generic API key patterns
    severity: HIGH
    regex: '(?i)(api_key|apikey|api-key)\s*[:=]\s*[A-Za-z0-9_-]{20,}'
    keywords:
      - api_key
      - apikey

  # Database credentials
  - id: db-password
    name: Database Password in Connection String
    description: Detects passwords in JDBC URLs
    severity: CRITICAL
    regex: 'jdbc:[^:]+://[^:]+:([^@]+)@'
    keywords:
      - password
      - pwd

  # JWT tokens
  - id: jwt-token
    name: JWT Token
    description: Detects JWT tokens
    severity: HIGH
    regex: 'eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+'
    keywords:
      - eyJ

  # Private keys
  - id: private-key
    name: Private Key
    description: Detects PEM private keys
    severity: CRITICAL
    regex: '-----BEGIN (RSA |EC |DSA )?PRIVATE KEY-----'
    keywords:
      - PRIVATE KEY

  # SSH keys
  - id: ssh-private-key
    name: SSH Private Key
    description: Detects SSH private keys
    severity: CRITICAL
    regex: '-----BEGIN OPENSSH PRIVATE KEY-----'
    keywords:
      - OPENSSH PRIVATE KEY

# Allowlist for false positives
allowlist:
  # Files to skip entirely
  paths:
    - "*.md"
    - "*.txt"
    - "*.yaml"
    - "*.yml"
    - "*.json"
    - "*.xml"
    - "*.properties"
    - "*.example"
    - "*.template"
    - ".gitignore"
    - ".dockerignore"
    - "LICENSE*"
    - "CHANGELOG*"
    - "README*"
    - "test/**"
    - "**/test/**"
    - "**/target/**"
    - "**/build/**"
    - "**/dist/**"
    - "**/node_modules/**"
    - "**/.git/**"

  # Specific strings to ignore (common test values)
  strings:
    - "CHANGE_ME"
    - "REPLACE_ME"
    - "YOUR_"
    - "EXAMPLE"
    - "TEST"
    - "DUMMY"
    - "FAKE"
    - "MOCK"
    - "PLACEHOLDER"
    - "your-"
    - "example.com"
    - "localhost"
    - "127.0.0.1"
    - "0.0.0.0"
    - "aircargo.example.com"
    - "staging.aircargo.example.com"
    - "api.aircargo.example.com"
    - "letsencrypt-prod"
    - "letsencrypt-staging"
    - "admin@yourdomain.com"
    - "noreply@example.com"
    - "smtp.example.com"
    - "smtp.gmail.com"
    - "smtp.office365.com"
    - "RANDOM"
    - "GENERATED"
    - "AUTO-GENERATED"

  # Regex patterns to ignore
  regex:
    - '^[A-F0-9]{64}$'  # SHA256 hashes
    - '^[a-f0-9]{32}$'  # MD5 hashes
    - '^v?\d+\.\d+\.\d+'  # Version strings
    - '^\d{4}-\d{2}-\d{2}'  # Dates
    - '^arn:aws:'  # AWS ARNs (not secrets themselves)
    - '^arn:aws:iam::\d+:role/'  # IAM roles