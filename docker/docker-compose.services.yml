x-common-env: &common-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-aircargo}
  POSTGRES_USER: ${POSTGRES_USER:-aircargo_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  SMTP_AUTH: ${SMTP_AUTH:-true}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  RABBITMQ_USER: ${RABBITMQ_USER:-aircargo}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:5174}

services:
  aircargo-gateway:
    build:
      context: ../backend
      dockerfile: aircargo-gateway/Dockerfile
    container_name: aircargo-gateway
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVICE_AUTH_URL: http://aircargo-auth-service:9092
      SERVICE_FLIGHT_URL: http://aircargo-flight-service:9093
      SERVICE_BOOKING_URL: http://aircargo-booking-service:9094
      SERVICE_MAWB_URL: http://aircargo-mawb-service:9095
      SERVICE_WAREHOUSE_URL: http://aircargo-warehouse-service:9096
      SERVICE_ULD_URL: http://aircargo-uld-service:9097
      SERVICE_LOAD_PLANNING_URL: http://aircargo-load-planning-service:9098
      SERVICE_EXPORT_URL: http://aircargo-export-service:9099
      SERVICE_NOTIFICATION_URL: http://aircargo-notification-service:9100
    ports:
      - "8080:8080"

  aircargo-auth-service:
    build:
      context: ../backend
      dockerfile: aircargo-auth-service/Dockerfile
    container_name: aircargo-auth-service
    restart: unless-stopped
    environment:
      <<: *common-env
    ports:
      - "9092:9092"
    depends_on:
      postgres:
        condition: service_healthy

  aircargo-flight-service:
    build:
      context: ../backend
      dockerfile: aircargo-flight-service/Dockerfile
    container_name: aircargo-flight-service
    restart: unless-stopped
    environment:
      <<: *common-env
    ports:
      - "9093:9093"
    depends_on:
      postgres:
        condition: service_healthy

  aircargo-booking-service:
    build:
      context: ../backend
      dockerfile: aircargo-booking-service/Dockerfile
    container_name: aircargo-booking-service
    restart: unless-stopped
    environment:
      <<: *common-env
    ports:
      - "9094:9094"
    depends_on:
      postgres:
        condition: service_healthy

  aircargo-mawb-service:
    build:
      context: ../backend
      dockerfile: aircargo-mawb-service/Dockerfile
    container_name: aircargo-mawb-service
    restart: unless-stopped
    environment:
      <<: *common-env
    ports:
      - "9095:9095"
    depends_on:
      postgres:
        condition: service_healthy

  aircargo-warehouse-service:
    build:
      context: ../backend
      dockerfile: aircargo-warehouse-service/Dockerfile
    container_name: aircargo-warehouse-service
    restart: unless-stopped
    environment:
      <<: *common-env
    ports:
      - "9096:9096"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  aircargo-uld-service:
    build:
      context: ../backend
      dockerfile: aircargo-uld-service/Dockerfile
    container_name: aircargo-uld-service
    restart: unless-stopped
    environment:
      <<: *common-env
    ports:
      - "9097:9097"
    depends_on:
      postgres:
        condition: service_healthy

  aircargo-load-planning-service:
    build:
      context: ../backend
      dockerfile: aircargo-load-planning-service/Dockerfile
    container_name: aircargo-load-planning-service
    restart: unless-stopped
    environment:
      <<: *common-env
    ports:
      - "9098:9098"
    depends_on:
      postgres:
        condition: service_healthy

  aircargo-export-service:
    build:
      context: ../backend
      dockerfile: aircargo-export-service/Dockerfile
    container_name: aircargo-export-service
    restart: unless-stopped
    environment:
      <<: *common-env
    ports:
      - "9099:9099"
    depends_on:
      postgres:
        condition: service_healthy

  aircargo-notification-service:
    build:
      context: ../backend
      dockerfile: aircargo-notification-service/Dockerfile
    container_name: aircargo-notification-service
    restart: unless-stopped
    environment:
      <<: *common-env
    ports:
      - "9100:9100"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
