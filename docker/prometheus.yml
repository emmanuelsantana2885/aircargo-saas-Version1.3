global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ── Servicios backend Aircargo (host: puertos 9092-9100 + gateway 8080) ──
  - job_name: 'aircargo-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'host.docker.internal:8080'   # gateway
          - 'host.docker.internal:9092'   # auth
          - 'host.docker.internal:9093'   # flight
          - 'host.docker.internal:9094'   # booking
          - 'host.docker.internal:9095'   # mawb
          - 'host.docker.internal:9096'   # warehouse
          - 'host.docker.internal:9097'   # uld
          - 'host.docker.internal:9098'   # load-planning
          - 'host.docker.internal:9099'   # export
          - 'host.docker.internal:9100'   # notification

  # ── RabbitMQ (plugin rabbitmq_prometheus, puerto 15692) ──
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']

  # ── Prometheus self-monitoring ──
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
