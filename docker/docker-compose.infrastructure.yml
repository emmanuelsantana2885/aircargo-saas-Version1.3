services:
  postgres:
    image: postgres:16-alpine
    container_name: aircargo-db
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aircargo}
      POSTGRES_USER: ${POSTGRES_USER:-aircargo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    command: postgres -c max_connections=150
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aircargo_user} -d ${POSTGRES_DB:-aircargo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    container_name: aircargo-rabbitmq
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-aircargo}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      # La imagen rabbitmq:4.0-management-alpine ya habilita rabbitmq_management por tag y
      # rabbitmq_prometheus por defecto; el bind-mount de enabled_plugins causaba eacces en el
      # boot por desajuste de ownership (usuario del contenedor UID 100 vs archivo UID 1000).
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"   # métricas Prometheus (plugin rabbitmq_prometheus)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Opcional — solo necesario en HA (2+ réplicas de gateway/servicios):
  # RATE_LIMIT_USE_REDIS=true en el gateway y SPRING_CACHE_TYPE=redis en los servicios.
  redis:
    image: redis:7-alpine
    container_name: aircargo-redis
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
