# ────────────────────────────────────────────────────────────────
# Observabilidad para single-host (dev/staging sin k8s)
#
#   docker compose -f docker/docker-compose.observability.yml up -d
#
#   Prometheus : http://localhost:9090  (targets: servicios en el host)
#   Grafana    : http://localhost:3001  (admin / GRAFANA_ADMIN_PASSWORD)
#
# Los servicios exponen métricas en /actuator/prometheus (micrometer).
# RabbitMQ expone las suyas en :15692 (plugin rabbitmq_prometheus).
# ────────────────────────────────────────────────────────────────

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: aircargo-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux: alcanzar los servicios del host
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'

  grafana:
    image: grafana/grafana:11.1.0
    container_name: aircargo-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-aircargo_admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

volumes:
  prometheus-data:
  grafana-data:
